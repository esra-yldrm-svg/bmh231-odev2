<!doctype html>
<html lang="tr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bozok Kampüs Etkinlikleri</title>
    <link rel="stylesheet" href="/stil.css">
</head>

<body>
    <header class="ust">
        <strong>Bozok Etkinlik</strong>

        <nav aria-label="Ana menü">
            <a href="#liste">Etkinlikler</a>
            <a href="#oneri">Etkinlik Öner</a>
        </nav>
    </header>

    <main>
        <section id="liste" aria-labelledby="baslik">
            <h1 id="baslik">Yaklaşan Etkinlikler</h1>

            <label for="arama">Etkinlik ara</label>
            <input id="arama" type="search" placeholder="Başlığa göre ara">

            <div class="filtre" aria-label="Etkinlik türü filtresi">
                <button class="secili" data-tur="tumu" type="button" aria-pressed="true">
                    Tümü
                </button>

                <button data-tur="atolye" type="button" aria-pressed="false">
                    Atölye
                </button>

                <button data-tur="soylesi" type="button" aria-pressed="false">
                    Söyleşi
                </button>

                <button data-tur="topluluk" type="button" aria-pressed="false">
                    Topluluk
                </button>
            </div>

            <p id="durum" role="status" aria-live="polite"></p>

            <div id="kartlar" class="kartlar"></div>
        </section>

        <section id="oneri" aria-labelledby="oneri-baslik">
            <h2 id="oneri-baslik">Etkinlik Öner</h2>

            <form id="form" novalidate>
                <label for="ad">Etkinlik adı</label>
                <input id="ad" name="ad" required minlength="5">

                <label for="tarih">Tarih</label>
                <input id="tarih" name="tarih" type="date" required>

                <label for="eposta">E-posta</label>
                <input id="eposta" name="eposta" type="email" required>

                <button type="submit">Öneriyi gönder</button>

                <p id="form-mesaj" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        © 2026 Bozok Etkinlik
    </footer>

    <script src="/betik.js" defer></script>
</body>

</html>
